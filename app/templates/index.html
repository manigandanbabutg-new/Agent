<!DOCTYPE html>
<html>

<head>
    <title>Nova AI</title>
</head>

<body>

    <h1>🤖 Nova AI</h1>

    <p id="status">Connecting...</p>

    <script>
        fetch("/test")
            .then(response => response.text())
            .then(message => {
                document.getElementById("status").textContent =
                    "✅ " + message;
            })
            .catch(error => {
                document.getElementById("status").textContent =
                    "❌ Backend not connected";
            });
    </script>

</body>

</html>
