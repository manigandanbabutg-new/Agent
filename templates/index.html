<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Nova AI</title>

<style>
body {
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    background:#09090b;
    color:white;
    font-family:Arial;
}

.card {
    width:300px;
    padding:35px;
    text-align:center;
    border:1px solid #333;
    border-radius:25px;
    background:#151518;
}

.mic {
    width:90px;
    height:90px;
    border-radius:50%;
    border:0;
    font-size:35px;
    cursor:pointer;
}

.status {
    margin-top:20px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="card">

    <h2>Nova AI</h2>

    <p>Say a song name</p>

    <button id="mic"
            class="mic">
        🎙️
    </button>

    <div id="status"
         class="status">
        Tap microphone
    </div>

</div>

<script>

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let youtubeTab = null;
let listening = false;

if (!SpeechRecognition) {

    status.textContent =
        "Speech recognition unavailable";

} else {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = () => {

        listening = true;

        status.textContent =
            "Listening...";

    };


    recognition.onend = () => {

        listening = false;

    };


    recognition.onerror = () => {

        listening = false;

        status.textContent =
            "Try again";

    };


    recognition.onresult =
        async (event) => {

        const command =
            event.results[0][0]
            .transcript
            .trim();

        if (!command)
            return;

        status.textContent =
            "Finding " + command;


        try {

            const response =
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                            "application/json"
                        },

                        body:JSON.stringify({
                            command:command
                        })
                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                status.textContent =
                    data.message ||
                    "Song not found";

                return;
            }


            /*
             * Create one YouTube tab.
             */

            if (
                !youtubeTab ||
                youtubeTab.closed
            ) {

                youtubeTab =
                    window.open(
                        data.url,
                        "NovaYouTube"
                    );

            } else {

                /*
                 * Reuse existing tab.
                 */

                youtubeTab.location.href =
                    data.url;

                youtubeTab.focus();

            }


            status.textContent =
                "Playing " + command;

        }

        catch(error) {

            console.error(error);

            status.textContent =
                "Connection error";

        }

    };


    mic.onclick = () => {

        if (listening)
            return;

        try {

            recognition.start();

        }

        catch(error) {

            console.log(error);

        }

    };

}

</script>

</body>
</html>
