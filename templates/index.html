```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Nova AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #09090b;
    color: white;

    font-family: Arial, sans-serif;
}

.card {
    width: 320px;

    padding: 35px;

    text-align: center;

    background: #151518;

    border: 1px solid #333;

    border-radius: 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.4);
}

h2 {
    margin-bottom: 8px;
}

p {
    color: #999;
}

.mic {
    width: 95px;
    height: 95px;

    margin-top: 20px;

    border: 0;

    border-radius: 50%;

    font-size: 38px;

    cursor: pointer;

    background: white;

    transition: .2s;
}

.mic:hover {
    transform: scale(1.08);
}

.mic.listening {
    transform: scale(1.12);
    box-shadow:
        0 0 0 10px rgba(255,255,255,.08);
}

.status {
    margin-top: 25px;

    min-height: 22px;

    color: #aaa;

    font-size: 14px;
}

.song {
    margin-top: 12px;

    color: white;

    font-size: 13px;

    word-break: break-word;
}

</style>

</head>


<body>


<div class="card">

    <h2>Nova AI</h2>

    <p>
        Say a song name
    </p>


    <button
        id="mic"
        class="mic">

        🎙️

    </button>


    <div
        id="status"
        class="status">

        Tap microphone

    </div>


    <div
        id="song"
        class="song">
    </div>

</div>



<script>

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const song =
    document.getElementById("song");



const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;



/*
 * Store the YouTube tab.
 *
 * This prevents multiple tabs.
 */

let youtubeTab = null;

let listening = false;



/*
 * Browser support check.
 */

if (!SpeechRecognition) {

    status.textContent =
        "Speech recognition unavailable";

    mic.disabled = true;

}



/*
 * Speech Recognition.
 */

else {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    /*
     * Microphone started.
     */

    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        status.textContent =
            "Listening...";

    };



    /*
     * Microphone stopped.
     */

    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };



    /*
     * Speech recognition error.
     */

    recognition.onerror =
        (event) => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

        console.log(
            "Speech error:",
            event.error
        );

        status.textContent =
            "Try again";

    };



    /*
     * Speech received.
     */

    recognition.onresult =
        async (event) => {


        const command =
            event.results[0][0]
            .transcript
            .trim();



        if (!command) {

            status.textContent =
                "No song detected";

            return;

        }



        song.textContent =
            command;



        status.textContent =
            "Finding song...";



        try {


            /*
             * Send command to Flask.
             */

            const response =
                await fetch(
                    "/youtube/play",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:
                                    command
                            })
                    }
                );



            const data =
                await response.json();



            /*
             * Backend error.
             */

            if (!data.success) {

                status.textContent =
                    data.message ||
                    "Song not found";

                return;

            }



            /*
             * YouTube video found.
             */

            status.textContent =
                "Opening YouTube...";



            /*
             * If tab does not exist,
             * create ONE tab.
             */

            if (
                !youtubeTab ||
                youtubeTab.closed
            ) {

                youtubeTab =
                    window.open(
                        data.url,
                        "NovaYouTube"
                    );

            }



            /*
             * If tab already exists,
             * reuse it.
             */

            else {

                youtubeTab.location.href =
                    data.url;

                youtubeTab.focus();

            }



            /*
             * Final status.
             */

            status.textContent =
                "Playing";

        }


        catch (error) {

            console.error(error);

            status.textContent =
                "Server connection failed";

        }

    };



    /*
     * Microphone button.
     */

    mic.onclick = () => {


        /*
         * Don't start twice.
         */

        if (listening)
            return;



        status.textContent =
            "Starting microphone...";


        try {

            recognition.start();

        }

        catch (error) {

            console.log(error);

        }

    };

}

</script>


</body>

</html>
```
